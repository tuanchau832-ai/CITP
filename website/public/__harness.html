<!doctype html><meta charset="utf-8"><title>harness</title>
<label><input type="checkbox" id="lk" checked> link</label>
<iframe id="sim" src="/embed/simulator/Simulation.html" sandbox="allow-scripts" style="width:480px;height:700px"></iframe>
<iframe id="mdl" src="/embed/station/index.html" sandbox="allow-scripts" style="width:480px;height:700px"></iframe>
<script>
const sim=document.getElementById('sim'), mdl=document.getElementById('mdl'); let linked=true; window.fwd=0;
document.getElementById('lk').onchange=e=>{linked=e.target.checked; if(!linked) mdl.contentWindow.postMessage({type:'station-unlink'},'*')};
addEventListener('message',e=>{ if(!linked||e.source!==sim.contentWindow) return; const d=e.data;
  if(!d||typeof d!=='object'||d.type!=='station-state') return; window.fwd++; mdl.contentWindow.postMessage(d,'*')});
</script>
